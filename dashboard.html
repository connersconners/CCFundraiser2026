<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Volunteer Dashboard — Conners Conners</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a; --white: #ffffff; --off-white: #f8f8f8; --light-gray: #eeeeee;
    --mid-gray: #999999; --border: #e0e0e0; --pending: #b07d3a; --pending-bg: #fdf3e3;
    --available: #2d6a4f; --available-bg: #edf5f0; --sold: #999999;
    --danger: #b03a3a; --danger-bg: #fdf0f0;
    --font: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  html, body { font-family: var(--font); background: var(--off-white); color: var(--black); font-size: 14px; min-height: 100vh; }

  /* LOGIN */
  .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--white); }
  .login-box { max-width: 340px; width: 100%; }
  .login-box h1 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
  .login-box .sub { font-size: 12px; color: var(--mid-gray); margin-bottom: 24px; }
  .field-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid-gray); display: block; margin-bottom: 5px; }
  .field-input { border: 1px solid var(--border); padding: 10px 12px; font-family: var(--font); font-size: 14px; background: var(--white); color: var(--black); outline: none; width: 100%; transition: border-color 0.1s; border-radius: 0; -webkit-appearance: none; }
  .field-input:focus { border-color: var(--black); }
  .login-error { font-size: 12px; color: var(--danger); margin: 8px 0; display: none; }
  .btn { display: block; width: 100%; padding: 11px 16px; font-family: var(--font); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; border: 1px solid var(--black); background: var(--black); color: var(--white); text-align: center; margin-top: 12px; transition: background 0.1s; }
  .btn:hover { background: #333; }
  .btn-sm { font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 12px; border: 1px solid; cursor: pointer; transition: all 0.1s; background: transparent; }
  .btn-sm-default { border-color: var(--border); color: var(--black); }
  .btn-sm-default:hover { border-color: var(--black); }
  .btn-sm-danger { border-color: var(--danger); color: var(--danger); }
  .btn-sm-danger:hover { background: var(--danger-bg); }

  /* DASHBOARD */
  .dashboard { display: none; }
  .dashboard.open { display: block; }

  header { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 24px; height: 48px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .logo { font-size: 14px; font-weight: 700; color: var(--black); }
  .header-tag { font-size: 11px; color: var(--mid-gray); margin-left: 10px; }
  .role-pill { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 10px; border: 1px solid; margin-left: 10px; }
  .role-pill.role-volunteer { color: var(--mid-gray); border-color: var(--border); background: var(--light-gray); }
  .role-pill.role-admin { color: var(--white); border-color: var(--black); background: var(--black); }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .stats-bar { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; overflow-x: auto; }
  .stat { padding: 14px 24px 14px 0; display: flex; flex-direction: column; gap: 2px; min-width: 80px; border-right: 1px solid var(--border); margin-right: 24px; }
  .stat:last-child { border-right: none; }
  .stat-value { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--mid-gray); text-transform: uppercase; letter-spacing: 0.06em; }

  .controls { padding: 16px 24px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--off-white); border-bottom: 1px solid var(--border); }
  .search-input { border: 1px solid var(--border); background: var(--white); padding: 8px 12px; font-family: var(--font); font-size: 12px; outline: none; transition: border-color 0.1s; min-width: 200px; border-radius: 0; }
  .search-input:focus { border-color: var(--black); }
  .filter-select { border: 1px solid var(--border); background: var(--white); padding: 8px 12px; font-family: var(--font); font-size: 12px; outline: none; cursor: pointer; color: var(--black); border-radius: 0; -webkit-appearance: none; }
  .close-all-btn { margin-left: auto; font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 8px 16px; border: 1px solid var(--danger); background: transparent; color: var(--danger); cursor: pointer; transition: all 0.1s; }
  .close-all-btn:hover { background: var(--danger-bg); }
  .admin-only { display: none; }
  .dashboard.is-admin .admin-only { display: inline-block; }
  .qr-btn { font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 8px 16px; border: 1px solid var(--border); background: var(--white); color: var(--black); cursor: pointer; transition: all 0.1s; }
  .qr-btn:hover { border-color: var(--black); }

  /* WORK LIST */
  .work-list { padding: 20px 24px; display: flex; flex-direction: column; gap: 10px; }
  .work-row { background: var(--white); border: 1px solid var(--border); overflow: hidden; }
  .work-row.status-pending { border-left: 3px solid var(--pending); }
  .work-row.status-sold { border-left: 3px solid var(--mid-gray); opacity: 0.65; }
  .work-row.status-available { border-left: 3px solid var(--black); }
  .work-row-header { padding: 14px 18px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; cursor: pointer; user-select: none; }
  .work-row-artist { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid-gray); margin-bottom: 2px; }
  .work-row-title { font-size: 14px; font-weight: 700; }
  .work-row-meta { font-size: 11px; color: var(--mid-gray); margin-top: 2px; }
  .work-row-price { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .work-row-badges { display: flex; align-items: center; gap: 8px; }
  .status-badge { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border: 1px solid currentColor; white-space: nowrap; }
  .badge-available { color: var(--black); }
  .badge-pending { color: var(--pending); }
  .badge-sold { color: var(--sold); }
  .queue-count { font-size: 10px; background: var(--pending-bg); color: var(--pending); border: 1px solid var(--pending); padding: 2px 7px; white-space: nowrap; }
  .chevron { font-size: 11px; color: var(--mid-gray); transition: transform 0.2s; }
  .work-row.expanded .chevron { transform: rotate(180deg); }

  .work-row-detail { display: none; border-top: 1px solid var(--border); background: var(--off-white); }
  .work-row.expanded .work-row-detail { display: block; }
  .detail-inner { padding: 18px; display: flex; flex-direction: column; gap: 14px; }

  /* STATUS CONTROLS */
  .status-controls { display: flex; flex-direction: column; gap: 8px; }
  .status-controls h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid-gray); margin-bottom: 4px; }
  .status-btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .status-btn { font-family: var(--font); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 12px; border: 1px solid; background: var(--white); cursor: pointer; transition: all 0.1s; }
  .status-btn-available { border-color: var(--black); color: var(--black); }
  .status-btn-available:hover { background: var(--light-gray); }
  .status-btn-pending { border-color: var(--pending); color: var(--pending); }
  .status-btn-pending:hover { background: var(--pending-bg); }
  .status-btn-sold { border-color: var(--sold); color: var(--sold); }
  .status-btn-sold:hover { background: var(--light-gray); }
  .status-btn-unsold { border-color: var(--danger); color: var(--danger); }
  .status-btn-unsold:hover { background: var(--danger-bg); }
  .status-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* QUEUE */
  .queue-section h4 { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid-gray); margin-bottom: 10px; }
  .queue-empty { font-size: 12px; color: var(--mid-gray); }
  .queue-item { background: var(--white); border: 1px solid var(--border); padding: 12px 14px; display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: start; margin-bottom: 8px; }
  .queue-position { font-size: 11px; color: var(--mid-gray); text-align: center; padding-top: 2px; font-weight: 700; }
  .queue-position.first { color: var(--pending); }
  .queue-buyer-name { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
  .queue-buyer-contact { font-size: 11px; color: var(--mid-gray); line-height: 1.7; }
  .queue-buyer-type { font-size: 10px; padding: 2px 7px; border: 1px solid var(--border); color: var(--mid-gray); white-space: nowrap; align-self: start; text-transform: uppercase; letter-spacing: 0.04em; }
  .queue-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .action-btn { font-family: var(--font); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 10px; border: 1px solid; background: var(--white); cursor: pointer; transition: all 0.1s; }
  .action-btn-confirm { border-color: var(--available); color: var(--available); }
  .action-btn-confirm:hover { background: var(--available-bg); }
  .action-btn-expire { border-color: var(--pending); color: var(--pending); }
  .action-btn-expire:hover { background: var(--pending-bg); }
  .action-btn-withdraw { border-color: var(--mid-gray); color: var(--mid-gray); }
  .action-btn-withdraw:hover { background: var(--light-gray); }

  /* CONFIRM MODAL */
  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 400; align-items: center; justify-content: center; padding: 20px; }
  .confirm-overlay.open { display: flex; }
  .confirm-box { background: var(--white); border: 1px solid var(--border); padding: 32px 28px; max-width: 380px; width: 100%; position: relative; z-index: 401; }
  .confirm-box h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .confirm-box p { font-size: 12px; color: #444; line-height: 1.6; margin-bottom: 8px; }
  .confirm-input-wrap { margin-bottom: 16px; }
  .confirm-actions { display: flex; gap: 8px; }
  .btn-full { flex: 1; padding: 10px; font-family: var(--font); font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; border: 1px solid; cursor: pointer; transition: all 0.1s; }
  .btn-confirm-yes { background: var(--black); color: var(--white); border-color: var(--black); }
  .btn-confirm-yes:hover { background: #333; }
  .btn-confirm-no { background: transparent; color: var(--black); border-color: var(--border); }
  .btn-confirm-no:hover { background: var(--off-white); }

  /* QR MODAL */
  .qr-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
  .qr-overlay.open { display: flex; }
  .qr-panel { background: var(--white); max-width: 960px; width: 100%; margin: auto; }
  .qr-panel-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .qr-panel-header h2 { font-size: 16px; font-weight: 700; }
  .qr-panel-actions { display: flex; gap: 10px; }
  .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--border); }
  .qr-item { background: var(--white); padding: 20px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .qr-item canvas { display: block; }
  .qr-item-artist { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid-gray); }
  .qr-item-title { font-size: 12px; font-weight: 700; line-height: 1.3; }
  .qr-item-price { font-size: 11px; color: var(--mid-gray); }
  .qr-item-id { font-size: 10px; color: var(--light-gray); font-family: monospace; }
  .qr-index-item { background: var(--off-white); border: 2px solid var(--black); }

  .status-bar { background: var(--white); border-top: 1px solid var(--border); padding: 10px 24px; font-size: 11px; color: var(--mid-gray); display: flex; align-items: center; gap: 8px; position: sticky; bottom: 0; }
  .pulse { display: inline-block; width: 6px; height: 6px; background: var(--available); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* TIMER WARNINGS */
  .timer-warnings { padding: 0 24px 4px; display: flex; flex-direction: column; gap: 8px; }
  .timer-warning-banner {
    background: var(--pending-bg); border: 1px solid var(--pending);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .timer-warning-banner.paused { background: var(--off-white); border-color: var(--border); }
  .timer-warning-text { font-size: 12px; color: var(--pending); flex: 1; min-width: 200px; font-weight: 700; }
  .timer-warning-banner.paused .timer-warning-text { color: var(--mid-gray); }
  .timer-countdown { font-family: var(--font); font-size: 11px; color: var(--pending); white-space: nowrap; }
  .timer-btn { font-family: var(--font); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 5px 10px; border: 1px solid; cursor: pointer; background: var(--white); transition: all 0.1s; white-space: nowrap; }
  .timer-btn-extend { border-color: var(--available); color: var(--available); }
  .timer-btn-extend:hover { background: var(--available-bg); }
  .timer-btn-pause { border-color: var(--pending); color: var(--pending); }
  .timer-btn-pause:hover { background: var(--pending-bg); }
  .timer-btn-unpause { border-color: var(--black); color: var(--black); }
  .timer-btn-unpause:hover { background: var(--light-gray); }

  /* PROMOTED INDICATOR on queue item */
  .promoted-badge { font-size: 10px; background: var(--available-bg); color: var(--available); border: 1px solid var(--available); padding: 2px 7px; white-space: nowrap; margin-left: 6px; }

  /* ADMIN PANELS */
  .admin-panels { padding: 0 24px 12px; display: flex; flex-direction: column; gap: 12px; }
  .admin-panel { border: 1px solid var(--border); background: var(--white); }
  .admin-panel-header { padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .admin-panel-header h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mid-gray); }
  .admin-panel-body { padding: 16px; display: none; }
  .admin-panel.open .admin-panel-body { display: block; }
  .admin-panel.open .admin-panel-header { border-bottom: 1px solid var(--border); }

  .mode-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .mode-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border: 1px solid; }
  .mode-badge-browse_only { border-color: var(--pending); color: var(--pending); background: var(--pending-bg); }
  .mode-badge-vip_window { border-color: var(--available); color: var(--available); background: var(--pending-bg); }
  .mode-badge-live { border-color: var(--available); color: var(--available); background: var(--available-bg); }
  .mode-badge-closed { border-color: var(--mid-gray); color: var(--mid-gray); background: var(--light-gray); }
  .mode-btn { font-family: var(--font); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 6px 12px; border: 1px solid var(--black); background: var(--white); color: var(--black); cursor: pointer; transition: all 0.1s; }
  .mode-btn:hover { background: var(--light-gray); }
  .mode-btn-live { border-color: var(--available); color: var(--available); }
  .mode-btn-live:hover { background: var(--available-bg); }
  .mode-btn-closed { border-color: var(--danger); color: var(--danger); }
  .mode-btn-closed:hover { background: var(--danger-bg); }
  .schedule-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .schedule-row label { font-size: 11px; color: var(--mid-gray); white-space: nowrap; }
  .schedule-input { border: 1px solid var(--border); background: var(--white); padding: 6px 10px; font-family: var(--font); font-size: 12px; outline: none; flex: 1; min-width: 180px; }
  .schedule-input:focus { border-color: var(--black); }

  .vip-btn { font-family: var(--font); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 10px; border: 1px solid; background: var(--white); cursor: pointer; white-space: nowrap; }
  .vip-btn-accept { border-color: var(--available); color: var(--available); }
  .vip-btn-accept:hover { background: var(--available-bg); }
  .vip-btn-decline { border-color: var(--mid-gray); color: var(--mid-gray); }
  .vip-btn-decline:hover { background: var(--light-gray); }

  /* VIP LIST (step 7) */
  .vip-list-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .vip-list-toolbar input[type="text"] { border: 1px solid var(--border); background: var(--white); padding: 6px 10px; font-family: var(--font); font-size: 12px; outline: none; min-width: 140px; }
  .vip-list-toolbar input[type="text"]:focus { border-color: var(--black); }
  .vip-list-toolbar input[type="file"] { font-size: 11px; }
  .vip-list-toolbar .export-btn { margin-left: auto; }
  .vip-list-status { font-size: 11px; color: var(--mid-gray); margin-bottom: 12px; min-height: 14px; }
  .vip-list-status.success { color: var(--available); }
  .vip-list-status.error { color: var(--danger); }
  .vip-row { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .vip-row:last-child { border-bottom: none; }
  .vip-row.inactive { opacity: 0.55; }
  .vip-row-name { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .vip-row-contact { font-size: 11px; color: var(--mid-gray); word-break: break-word; }
  .vip-row-attribution { font-size: 11px; color: var(--mid-gray); margin-top: 2px; font-style: italic; }
  .vip-row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .vip-toggle { display: flex; align-items: center; gap: 5px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--mid-gray); cursor: pointer; white-space: nowrap; }
  .vip-toggle input { cursor: pointer; }
  .vip-action-feedback { font-size: 10px; color: var(--available); white-space: nowrap; opacity: 0; transition: opacity 0.2s; min-width: 50px; }
  .vip-action-feedback.show { opacity: 1; }
  .vip-action-feedback.error { color: var(--danger); }

  /* PHASE BANNER (step 8) */
  .phase-banner { padding: 12px 18px; margin: 12px 24px 0; border-left: 3px solid; font-size: 12px; line-height: 1.5; }
  .phase-banner-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .phase-banner-browse_only { background: var(--pending-bg); border-color: var(--pending); color: #5a3e1d; }
  .phase-banner-browse_only .phase-banner-title { color: var(--pending); }
  .phase-banner-vip_window { background: var(--pending-bg); border-color: var(--available); color: #1d4a35; }
  .phase-banner-vip_window .phase-banner-title { color: var(--available); }
  .phase-banner-closed { background: var(--light-gray); border-color: var(--mid-gray); color: #555; }
  .phase-banner-closed .phase-banner-title { color: var(--mid-gray); }

  @media print {
    .dashboard > *:not(.qr-overlay) { display: none !important; }
    .qr-overlay { position: static; display: block !important; background: none; padding: 0; }
    .qr-panel { max-width: 100%; box-shadow: none; }
    .qr-panel-header, .qr-panel-actions { display: none !important; }
    .qr-grid { gap: 0; }
    .qr-item { break-inside: avoid; border: 1px solid #ddd; }
  }

  @media (max-width: 600px) {
    header { padding: 0 16px; }
    .stats-bar { padding: 0 16px; }
    .controls { padding: 12px 16px; }
    .work-list { padding: 12px 16px; }
    .work-row-header { grid-template-columns: 1fr auto; }
    .work-row-price { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <h1>Conners Conners</h1>
    <p class="sub">Volunteer dashboard — Fundraiser 2026</p>
    <label class="field-label">Password</label>
    <input type="password" class="field-input" id="password-input" placeholder="Enter password"
           onkeydown="if(event.key==='Enter'){event.preventDefault();attemptLogin();}">
    <div class="login-error" id="login-error">Incorrect password.</div>
    <button class="btn" type="button" onclick="attemptLogin()">Sign in</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <header>
    <div style="display:flex;align-items:center">
      <span class="logo">Conners Conners</span>
      <span class="role-pill role-volunteer" id="role-tag">Volunteer</span>
    </div>
    <div class="header-actions">
      <button class="btn-sm btn-sm-default" onclick="loadWorks()">↻ Refresh</button>
      <button class="btn-sm btn-sm-danger admin-only" onclick="confirmCloseAll()">Close all sales</button>
      <button class="btn-sm btn-sm-default" onclick="logout()">Sign out</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat"><span class="stat-value" id="stat-total">—</span><span class="stat-label">Total</span></div>
    <div class="stat"><span class="stat-value" id="stat-available">—</span><span class="stat-label">Available</span></div>
    <div class="stat"><span class="stat-value" id="stat-pending" style="color:var(--pending)">—</span><span class="stat-label">Pending</span></div>
    <div class="stat"><span class="stat-value" id="stat-sold" style="color:var(--mid-gray)">—</span><span class="stat-label">Sold</span></div>

  </div>

  <div class="controls">
    <input class="search-input" id="search-input" type="search" placeholder="Search artist or title…" oninput="renderList()">
    <select class="filter-select" id="filter-select" onchange="renderList()">
      <option value="all">All works</option>
      <option value="available">Available</option>
      <option value="pending">Pending</option>
      <option value="sold">Sold</option>
    </select>
    <button class="qr-btn" onclick="openQRPanel()">⊞ QR codes</button>
    <button class="close-all-btn admin-only" onclick="confirmCloseAll()">⚠ Close all sales</button>
  </div>

  <div class="phase-banner" id="phase-banner" style="display:none"></div>

  <div class="timer-warnings" id="timer-warnings"></div>

  <!-- ADMIN PANELS (shown only when logged in as admin) -->
  <div class="admin-panels" id="admin-panels" style="display:none">

    <!-- Gallery mode control -->
    <div class="admin-panel" id="panel-mode">
      <div class="admin-panel-header" onclick="toggleAdminPanel('panel-mode')">
        <h3>Gallery mode</h3>
        <span id="mode-badge-header" class="mode-badge mode-badge-browse_only">Browse only</span>
      </div>
      <div class="admin-panel-body">
        <div class="mode-row">
          <button class="mode-btn" onclick="setMode('browse_only')">Browse only</button>
          <button class="mode-btn" onclick="setMode('vip_window')">VIP window</button>
          <button class="mode-btn mode-btn-live" onclick="setMode('live')">Go live</button>
          <button class="mode-btn mode-btn-closed" onclick="setMode('closed')">Close gallery</button>
        </div>
        <div class="schedule-row">
          <label>Schedule VIP window:</label>
          <input type="datetime-local" class="schedule-input" id="schedule-vip-window-input">
          <button class="mode-btn" onclick="scheduleTransition('vip_window')">Schedule</button>
          <button class="mode-btn" onclick="cancelTransition('vip_window')">Cancel</button>
        </div>
        <p style="font-size:11px;color:var(--mid-gray);margin-top:6px" id="schedule-vip-window-status"></p>
        <div class="schedule-row">
          <label>Schedule go-live:</label>
          <input type="datetime-local" class="schedule-input" id="schedule-live-input">
          <button class="mode-btn mode-btn-live" onclick="scheduleTransition('live')">Schedule</button>
          <button class="mode-btn" onclick="cancelTransition('live')">Cancel</button>
        </div>
        <p style="font-size:11px;color:var(--mid-gray);margin-top:6px" id="schedule-live-status"></p>
      </div>
    </div>

    <!-- VIP list (step 7) -->
    <div class="admin-panel" id="panel-vip-list">
      <div class="admin-panel-header" onclick="toggleAdminPanel('panel-vip-list')">
        <h3>VIP list</h3>
        <span id="vip-list-count" style="font-size:11px;color:var(--mid-gray)">Loading…</span>
      </div>
      <div class="admin-panel-body">
        <div class="vip-list-toolbar">
          <input type="file" id="vip-csv-input" accept=".csv,text/csv">
          <input type="text" id="vip-batch-input" placeholder="Batch label (optional)">
          <button class="mode-btn" onclick="importVipCsv()">Import CSV</button>
          <button class="mode-btn export-btn" onclick="exportVipCsv()">Download CSV with tokens</button>
        </div>
        <div class="vip-list-status" id="vip-list-status"></div>
        <div id="vip-list-rows">
          <p style="font-size:12px;color:var(--mid-gray)">Loading VIPs…</p>
        </div>
      </div>
    </div>

  </div>

  <div class="work-list" id="work-list">
    <p style="font-size:12px;color:var(--mid-gray);padding:20px 0">Loading works…</p>
  </div>

  <div class="status-bar">
    <span class="pulse"></span>
    <span id="last-updated">Auto-refreshes every 15 seconds</span>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <h3 id="confirm-title">Confirm action</h3>
    <p id="confirm-body"></p>
    <div class="confirm-input-wrap" id="confirm-input-wrap" style="display:none">
      <label class="field-label" style="margin-top:8px">Admin password required</label>
      <input type="password" class="field-input" id="confirm-admin-pwd" placeholder="Enter admin password"
             onkeydown="if(event.key==='Enter'){event.preventDefault();executePending();}">
      <div style="font-size:11px;color:var(--danger);margin-top:6px;display:none" id="admin-pwd-error">Incorrect admin password.</div>
    </div>
    <div class="confirm-actions">
      <button class="btn-full btn-confirm-yes" id="confirm-yes-btn">Confirm</button>
      <button class="btn-full btn-confirm-no" id="confirm-no-btn">Cancel</button>
    </div>
  </div>
</div>

<!-- QR CODE PANEL -->
<div class="qr-overlay" id="qr-overlay">
  <div class="qr-panel">
    <div class="qr-panel-header">
      <h2>QR codes</h2>
      <div class="qr-panel-actions">
        <button class="qr-btn" onclick="window.print()">Print all</button>
        <button class="qr-btn" onclick="closeQRPanel()">Close</button>
      </div>
    </div>
    <div class="qr-grid" id="qr-grid"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbwm1RTBH6_pfJgPmzQApy4FbOFqQJmwVOAgpdzrS-45Yp_j88qRJyZnBeCX-5ovgaR8/exec';
const VOLUNTEER_PASSWORD = 'PORTICO2019';  // change before event
const ADMIN_PASSWORD = 'CABOOSE2026';           // change before event — required for Sold → Available
const AUTO_REFRESH = 15000;

// Public gallery base URL — update if your GitHub Pages URL changes
const GALLERY_URL = 'https://connersconners.github.io/CCFundraiser2026/index.html';

let allWorks = [], refreshTimer = null, pendingAction = null, isAdmin = false, allTimers = [], galleryMode = 'browse_only';

// ---- AUTH ----
function attemptLogin() {
  const pwd = document.getElementById('password-input').value;
  if (pwd === VOLUNTEER_PASSWORD || pwd === ADMIN_PASSWORD) {
    isAdmin = (pwd === ADMIN_PASSWORD);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').classList.add('open');
    const roleTag = document.getElementById('role-tag');
    roleTag.textContent = isAdmin ? 'Admin' : 'Volunteer';
    roleTag.className = isAdmin ? 'role-pill role-admin' : 'role-pill role-volunteer';
    document.getElementById('admin-panels').style.display = isAdmin ? 'flex' : 'none';
    document.getElementById('dashboard').classList.toggle('is-admin', isAdmin);
    loadWorks();
    refreshTimer = setInterval(loadWorks, AUTO_REFRESH);
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('password-input').value = '';
    document.getElementById('password-input').focus();
  }
}

function logout() {
  clearInterval(refreshTimer);
  document.getElementById('dashboard').classList.remove('open');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('password-input').value = '';
  isAdmin = false;
  document.getElementById('dashboard').classList.remove('is-admin');
}

// ---- DATA ----
async function loadWorks() {
  try {
    const pwd = isAdmin ? ADMIN_PASSWORD : VOLUNTEER_PASSWORD;
    const res = await fetch(SHEET_API_URL + '?action=getWorksAdmin&pwd=' + encodeURIComponent(pwd));
    const data = await res.json();
    if (data.works) {
      allWorks = data.works.filter(w => w.id && (w.artist || w.title));
      allTimers = data.timers || [];
      galleryMode = data.mode || 'browse_only';
      renderList(); updateStats(); renderTimerWarnings(); updateModeDisplay();
      if (isAdmin) { loadVipList(); }
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-AU', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
  } catch(e) { console.error('Refresh failed', e); }
}

async function sendAction(payload, pwdOverride) {
  try {
    const res = await fetch(SHEET_API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({...payload, pwd: pwdOverride || (isAdmin ? ADMIN_PASSWORD : VOLUNTEER_PASSWORD)}),
    });
    const data = await res.json();
    if (data.works) {
      allWorks = data.works.filter(w => w.id && (w.artist || w.title));
      allTimers = data.timers || allTimers;
      renderList(); updateStats(); renderTimerWarnings();
    }
    return data;
  } catch(e) { console.error('Action failed', e); return { success: false }; }
}

// ---- RENDER ----
function renderList() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const filter = document.getElementById('filter-select').value;
  let works = allWorks.filter(w => {
    const mf = filter === 'all' || w.status === filter;
    const ms = !search || (w.artist||'').toLowerCase().includes(search) || (w.title||'').toLowerCase().includes(search);
    return mf && ms;
  });
  works.sort((a,b) => {
    const o = {pending:0, available:1, sold:2};
    if (o[a.status] !== o[b.status]) return o[a.status] - o[b.status];
    return (b.queue?.length||0) - (a.queue?.length||0);
  });
  const list = document.getElementById('work-list');
  if (!works.length) { list.innerHTML = '<p style="font-size:12px;color:var(--mid-gray);padding:20px 0">No works match.</p>'; return; }
  list.innerHTML = works.map(w => buildRow(w)).join('');
}

function buildRow(w) {
  const qLen = w.queue?.length || 0;
  const s = w.status || 'available';

  // Status buttons — show only transitions that make sense for this role
  const canMarkAvailable = s !== 'available';
  const canMarkPending   = s !== 'pending';
  const canMarkSold      = s !== 'sold';
  const requiresAdmin    = s === 'sold'; // reversing sold → anything needs admin

  const statusBtns = `
    <button class="status-btn status-btn-available"
      data-action="${requiresAdmin ? 'adminSetStatus' : 'setStatus'}"
      data-work-id="${w.id}" data-new-status="available"
      ${!canMarkAvailable ? 'disabled' : ''}>
      Mark available
    </button>
    <button class="status-btn status-btn-pending"
      data-action="setStatus" data-work-id="${w.id}" data-new-status="pending"
      ${!canMarkPending ? 'disabled' : ''}>
      Mark pending
    </button>
    <button class="status-btn status-btn-sold"
      data-action="setStatus" data-work-id="${w.id}" data-new-status="sold"
      ${!canMarkSold ? 'disabled' : ''}>
      Mark sold
    </button>`;

  const queueItems = qLen === 0
    ? '<p class="queue-empty">No commitments yet.</p>'
    : w.queue.map((b,i) => `
        <div class="queue-item">
          <div class="queue-position ${i===0?'first':''}">${i+1}</div>
          <div>
            <div class="queue-buyer-name">${esc(b.name)}${i===0 && allTimers.find(t=>t.workId===w.id && !t.warningShown && !t.paused && t.minLeft <= 30 && t.minLeft > 0) ? `<span class="promoted-badge">Email sent · ${allTimers.find(t=>t.workId===w.id).minLeft}m left</span>` : ''}</div>
            <div class="queue-buyer-contact">${esc(b.email)}<br>${esc(b.phone)}${b.timestamp?'<br>'+fmt(b.timestamp):''}${b.vipOptIn==='true'||b.vipOptIn===true?' · VIP ✓':''}</div>
            ${i===0 ? `<div class="queue-actions">
              <button class="action-btn action-btn-confirm" onclick="confirmAction('confirmSold','${w.id}','','Mark as sold to ${escA(b.name)}?','This marks the work as sold and clears the queue.')">✓ Confirm sold</button>
              <button class="action-btn action-btn-expire" onclick="confirmAction('expireFirst','${w.id}','','Expire this commitment?','${escA(b.name)} did not complete payment. They will be removed and the next person promoted.')">Expire</button>
              <button class="action-btn action-btn-withdraw" onclick="confirmAction('withdrawFirst','${w.id}','','Withdraw commitment for ${escA(b.name)}?','${escA(b.name)} has requested to withdraw. They will be removed and the next person promoted.')">Withdraw</button>
            </div>` : ''}
          </div>
          <span class="queue-buyer-type">${b.paymentType==='transfer'?'Transfer':'At desk'}</span>
        </div>`).join('');

  return `
    <div class="work-row status-${s}" id="row-${w.id}">
      <div class="work-row-header" onclick="toggleRow('${w.id}')">
        <div>
          <div class="work-row-artist">${esc(w.artist||'')}</div>
          <div class="work-row-title">${esc(w.title||'Untitled')}</div>
          <div class="work-row-meta">${[w.medium,w.dimensions].filter(Boolean).join(' · ')}</div>
        </div>
        <div class="work-row-price">${w.price?'$'+Number(w.price).toLocaleString():''}</div>
        <div class="work-row-badges">
          <span class="status-badge badge-${s}">${statusLabel(s)}</span>
          ${qLen>0?`<span class="queue-count">${qLen} in queue</span>`:''}
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="work-row-detail">
        <div class="detail-inner">
          <div class="status-controls">
            <h4>Status</h4>
            <div class="status-btn-row">${statusBtns}</div>
            ${s==='sold' && !isAdmin ? '<p style="font-size:11px;color:var(--mid-gray);margin-top:4px">Reversing a sold status requires the admin password.</p>' : ''}
          </div>
          <div class="queue-section"><h4>Purchase queue</h4>${queueItems}</div>
        </div>
      </div>
    </div>`;
}

function toggleRow(id) { document.getElementById('row-'+id)?.classList.toggle('expanded'); }

function updateStats() {
  document.getElementById('stat-total').textContent = allWorks.length;
  document.getElementById('stat-available').textContent = allWorks.filter(w=>w.status==='available').length;
  document.getElementById('stat-pending').textContent = allWorks.filter(w=>w.status==='pending').length;
  document.getElementById('stat-sold').textContent = allWorks.filter(w=>w.status==='sold').length;

}

// ---- CONFIRM (standard) ----
function confirmAction(action, workId, newStatus, title, body) {
  pendingAction = {action, workId, newStatus, requiresAdmin: false};
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent = body;
  document.getElementById('confirm-input-wrap').style.display = 'none';
  document.getElementById('admin-pwd-error').style.display = 'none';
  document.getElementById('confirm-overlay').classList.add('open');
}

// ---- CONFIRM (admin required — sold → available) ----
function confirmAdminAction(action, workId, newStatus, title, body) {
  if (isAdmin) {
    // Already logged in as admin — skip password prompt
    pendingAction = {action, workId, newStatus, requiresAdmin: false};
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-body').textContent = body;
    document.getElementById('confirm-input-wrap').style.display = 'none';
    document.getElementById('confirm-overlay').classList.add('open');
    return;
  }
  pendingAction = {action, workId, newStatus, requiresAdmin: true};
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent = body;
  document.getElementById('confirm-input-wrap').style.display = 'block';
  document.getElementById('confirm-admin-pwd').value = '';
  document.getElementById('admin-pwd-error').style.display = 'none';
  document.getElementById('confirm-overlay').classList.add('open');
  setTimeout(() => document.getElementById('confirm-admin-pwd').focus(), 100);
}

function confirmCloseAll() {
  const title = 'Close all sales?';
  const body = 'This will mark ALL remaining works as sold and clear all queues. This cannot be undone.';
  if (isAdmin) {
    pendingAction = {action:'closeAll', requiresAdmin: false};
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-body').textContent = body;
    document.getElementById('confirm-input-wrap').style.display = 'none';
    document.getElementById('admin-pwd-error').style.display = 'none';
    document.getElementById('confirm-overlay').classList.add('open');
    return;
  }
  pendingAction = {action:'closeAll', requiresAdmin: true};
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-body').textContent = body + ' Requires the admin password.';
  document.getElementById('confirm-input-wrap').style.display = 'block';
  document.getElementById('confirm-admin-pwd').value = '';
  document.getElementById('admin-pwd-error').style.display = 'none';
  document.getElementById('confirm-overlay').classList.add('open');
  setTimeout(() => document.getElementById('confirm-admin-pwd').focus(), 100);
}

async function executePending() {
  if (!pendingAction) return;

  if (pendingAction.requiresAdmin) {
    const pwd = document.getElementById('confirm-admin-pwd').value;
    if (pwd !== ADMIN_PASSWORD) {
      document.getElementById('admin-pwd-error').style.display = 'block';
      return;
    }
  }

  const adminOverride = pendingAction.requiresAdmin ? ADMIN_PASSWORD : null;
  closeConfirm();
  await sendAction(pendingAction, adminOverride);
  pendingAction = null;
}

function closeConfirm() {
  document.getElementById('confirm-overlay').classList.remove('open');
  document.getElementById('confirm-admin-pwd').value = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeConfirm(); closeQRPanel(); } });
document.getElementById('confirm-yes-btn').addEventListener('click', executePending);
document.getElementById('confirm-no-btn').addEventListener('click', closeConfirm);

// Delegated handler for status buttons (avoids inline onclick quote issues)
document.getElementById('work-list') && document.addEventListener('click', e => {
  const btn = e.target.closest('.status-btn[data-action]');
  if (!btn || btn.disabled) return;
  const action    = btn.dataset.action;
  const workId    = btn.dataset.workId;
  const newStatus = btn.dataset.newStatus;
  if (action === 'setStatus') {
    const titles = { available: 'Mark as available?', pending: 'Mark as pending?', sold: 'Mark as sold?' };
    const bodies = { available: 'Work will be listed as available.', pending: 'Work will show as pending purchase.', sold: 'Use this for Square terminal payments on the night.' };
    confirmAction('setStatus', workId, newStatus, titles[newStatus], bodies[newStatus]);
  } else if (action === 'adminSetStatus') {
    confirmAdminAction('setStatus', workId, newStatus, 'Mark as available?', 'This will reverse a sold status and requires the admin password.');
  }
});

// ---- QR CODES ----
function openQRPanel() {
  const grid = document.getElementById('qr-grid');
  grid.innerHTML = '';

  // Index QR first
  const indexItem = document.createElement('div');
  indexItem.className = 'qr-item qr-index-item';
  indexItem.innerHTML = `
    <div class="qr-item-artist">Event brochure</div>
    <div class="qr-item-title">Conners Conners Fundraiser 2026</div>
    <div id="qr-index-canvas"></div>
    <div class="qr-item-price">Main gallery</div>`;
  grid.appendChild(indexItem);
  new QRCode(document.getElementById('qr-index-canvas'), {
    text: GALLERY_URL, width: 160, height: 160, colorDark: '#0a0a0a', colorLight: '#ffffff',
  });

  // Per-work QR codes
  allWorks.forEach(w => {
    const item = document.createElement('div');
    item.className = 'qr-item';
    const canvasId = 'qr-' + w.id;
    item.innerHTML = `
      <div class="qr-item-artist">${esc(w.artist||'')}</div>
      <div id="${canvasId}"></div>
      <div class="qr-item-title">${esc(w.title||'Untitled')}</div>
      <div class="qr-item-price">${w.price?'$'+Number(w.price).toLocaleString():''}</div>
      <div class="qr-item-id">${w.id}</div>`;
    grid.appendChild(item);
    new QRCode(document.getElementById(canvasId), {
      text: GALLERY_URL + '#' + w.id,
      width: 160, height: 160,
      colorDark: '#0a0a0a', colorLight: '#ffffff',
    });
  });

  document.getElementById('qr-overlay').classList.add('open');
}

function closeQRPanel() { document.getElementById('qr-overlay').classList.remove('open'); }

// ---- TIMER WARNINGS ----
function renderTimerWarnings() {
  const container = document.getElementById('timer-warnings');
  if (!allTimers.length) { container.innerHTML = ''; return; }

  const warnings = allTimers.filter(t => t.warningShown || t.paused);
  if (!warnings.length) { container.innerHTML = ''; return; }

  container.innerHTML = warnings.map(t => {
    const isPaused = t.paused;
    const canExtend = !t.extended && !isPaused;
    const timeText = isPaused ? 'Timer paused' : `${t.minLeft} min remaining`;

    return `<div class="timer-warning-banner ${isPaused ? 'paused' : ''}">
      <div class="timer-warning-text">
        ${isPaused ? '⏸ Paused:' : '⚠ Expiring soon:'} ${esc(t.buyerName)} — ${esc(t.workTitle)}
      </div>
      <span class="timer-countdown">${timeText}</span>
      ${canExtend ? `<button class="timer-btn timer-btn-extend" onclick="timerExtend('${t.workId}','${t.queueTimestamp}')">+5 min</button>` : ''}
      ${!isPaused ? `<button class="timer-btn timer-btn-pause" onclick="timerPause('${t.workId}','${t.queueTimestamp}')">Pause</button>` : ''}
      ${isPaused ? `<button class="timer-btn timer-btn-unpause" onclick="timerUnpause('${t.workId}','${t.queueTimestamp}')">Resume</button>` : ''}
    </div>`;
  }).join('');
}

async function timerExtend(workId, queueTimestamp) {
  await sendAction({ action: 'extendTimer', workId, queueTimestamp });
}

async function timerPause(workId, queueTimestamp) {
  await sendAction({ action: 'pauseTimer', workId, queueTimestamp });
}

async function timerUnpause(workId, queueTimestamp) {
  await sendAction({ action: 'unpauseTimer', workId, queueTimestamp });
}

// ---- GALLERY MODE ----
const MODE_LABELS = {
  browse_only: 'Browse only',
  vip_window:  'VIP window',
  live:        'Live',
  closed:      'Closed',
};

function updateModeDisplay() {
  const el = document.getElementById('mode-badge-header');
  if (el) {
    el.textContent = MODE_LABELS[galleryMode] || galleryMode;
    el.className = 'mode-badge mode-badge-' + galleryMode;
  }
  updatePhaseBanner();
}

// Step 8: phase indicator banner, shown for all non-live phases to both
// volunteers and admin so they understand what state the gallery is in.
function updatePhaseBanner() {
  const banner = document.getElementById('phase-banner');
  if (!banner) return;

  const messages = {
    browse_only: { title: 'Browse only', body: 'Gallery in browse-only mode. No commits possible. Sales open shortly.' },
    vip_window:  { title: 'VIP early access', body: 'Only VIPs with personal token links can commit. Public visitors can browse but not buy.' },
    closed:      { title: 'Gallery closed', body: 'Sales are closed. No commits possible.' },
  };

  const msg = messages[galleryMode];
  if (!msg) { banner.style.display = 'none'; return; }

  banner.className = 'phase-banner phase-banner-' + galleryMode;
  banner.innerHTML = '<div class="phase-banner-title">' + esc(msg.title) + '</div>' + esc(msg.body);
  banner.style.display = 'block';
}

async function setMode(mode) {
  const label = (MODE_LABELS[mode] || mode).toLowerCase();
  if (!confirm('Set gallery to ' + label + '?')) return;
  const res = await fetch(SHEET_API_URL, {
    method: 'POST', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ action: 'setGalleryMode', mode, pwd: ADMIN_PASSWORD }),
  });
  const data = await res.json();
  if (data.success) {
    galleryMode = mode;
    updateModeDisplay();
    // Manual mode change cancels both scheduled transitions backend-side; clear UI too
    const vw = document.getElementById('schedule-vip-window-status');
    const lv = document.getElementById('schedule-live-status');
    if (vw) vw.textContent = '';
    if (lv) lv.textContent = '';
  }
}

// Schedule a transition. target is 'vip_window' or 'live'.
async function scheduleTransition(target) {
  const inputId  = target === 'vip_window' ? 'schedule-vip-window-input'  : 'schedule-live-input';
  const statusId = target === 'vip_window' ? 'schedule-vip-window-status' : 'schedule-live-status';
  const val = document.getElementById(inputId).value;
  if (!val) { alert('Please select a date and time.'); return; }
  const iso = new Date(val).toISOString();
  const res = await fetch(SHEET_API_URL, {
    method: 'POST', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ action: 'scheduleGalleryMode', target, scheduledTime: iso, pwd: ADMIN_PASSWORD }),
  });
  const data = await res.json();
  if (data.success) {
    document.getElementById(statusId).textContent =
      'Scheduled: switch to ' + (MODE_LABELS[target]||target) + ' at ' + new Date(val).toLocaleString('en-AU');
  }
}

async function cancelTransition(target) {
  const inputId  = target === 'vip_window' ? 'schedule-vip-window-input'  : 'schedule-live-input';
  const statusId = target === 'vip_window' ? 'schedule-vip-window-status' : 'schedule-live-status';
  await fetch(SHEET_API_URL, {
    method: 'POST', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ action: 'scheduleGalleryMode', target, scheduledTime: '', pwd: ADMIN_PASSWORD }),
  });
  document.getElementById(inputId).value = '';
  document.getElementById(statusId).textContent = 'Schedule cancelled.';
}

function toggleAdminPanel(id) {
  document.getElementById(id)?.classList.toggle('open');
}

// ---- VIP LIST (step 7) ----
let allVips = [];

async function loadVipList() {
  try {
    const res = await fetch(SHEET_API_URL + '?action=adminGetVipList&pwd=' + encodeURIComponent(ADMIN_PASSWORD));
    const data = await res.json();
    if (data.vips) { allVips = data.vips; renderVipList(); }
  } catch(e) { console.error('VIP list load failed', e); }
}

function renderVipList() {
  const active = allVips.filter(v => v.active).length;
  const total = allVips.length;
  const countEl = document.getElementById('vip-list-count');
  if (countEl) countEl.textContent = total === 0 ? 'No VIPs yet' : active + ' active / ' + total + ' total';

  const body = document.getElementById('vip-list-rows');
  if (!body) return;

  if (!allVips.length) {
    body.innerHTML = '<p style="font-size:12px;color:var(--mid-gray)">No VIPs yet. Import a CSV to add some.</p>';
    return;
  }

  body.innerHTML = allVips.map(v => `
    <div class="vip-row ${v.active ? '' : 'inactive'}">
      <div>
        <div class="vip-row-name">${esc(v.name)}</div>
        <div class="vip-row-contact">${esc(v.email)}${v.phone ? ' · ' + esc(v.phone) : ''}</div>
        ${v.attribution ? `<div class="vip-row-attribution">With thanks to ${esc(v.attribution)}</div>` : ''}
      </div>
      <label class="vip-toggle">
        <input type="checkbox" ${v.active ? 'checked' : ''} onchange="toggleVipActive('${escA(v.token)}', this.checked)">
        Active
      </label>
      <div class="vip-row-actions">
        <button class="vip-btn vip-btn-accept" onclick="copyVipUrl('${escA(v.token)}')">Copy URL</button>
        <button class="vip-btn vip-btn-decline" onclick="resendVipEmail('${escA(v.token)}','${escA(v.name)}')">Resend email</button>
        <span class="vip-action-feedback" id="vip-feedback-${esc(v.token)}"></span>
      </div>
    </div>
  `).join('');
}

async function importVipCsv() {
  const fileInput = document.getElementById('vip-csv-input');
  const batchInput = document.getElementById('vip-batch-input');
  const file = fileInput.files[0];
  if (!file) { setVipStatus('Choose a CSV file first.', 'error'); return; }

  setVipStatus('Reading file…', '');
  try {
    const text = await file.text();
    const res = await fetch(SHEET_API_URL, {
      method: 'POST', headers: {'Content-Type':'text/plain'},
      body: JSON.stringify({ action: 'adminImportVipList', csv: text, batch: batchInput.value.trim(), pwd: ADMIN_PASSWORD }),
    });
    const data = await res.json();
    if (data.success) {
      const reasons = (data.skipReasons && data.skipReasons.length) ? ' Reasons: ' + data.skipReasons.join('; ') : '';
      setVipStatus('Added ' + data.added + ', skipped ' + data.skipped + '.' + reasons, 'success');
      fileInput.value = '';
      batchInput.value = '';
      loadVipList();
    } else {
      setVipStatus(data.error || 'Import failed.', 'error');
    }
  } catch(e) {
    console.error('CSV import failed', e);
    setVipStatus('Import failed: ' + e.message, 'error');
  }
}

function exportVipCsv() {
  if (!allVips.length) { setVipStatus('No VIPs to export.', 'error'); return; }
  const baseUrl = GALLERY_URL.replace(/\/index\.html$/, '/');
  const headers = ['name','email','phone','attribution','token','url','active','firstSeen','batch'];
  const rows = allVips.map(v => [
    v.name, v.email, v.phone, v.attribution, v.token,
    baseUrl + '?token=' + encodeURIComponent(v.token),
    v.active ? 'true' : 'false', v.firstSeen || '', v.batch || '',
  ]);
  const csv = [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url; a.download = 'cc-vips-' + ts + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setVipStatus('Exported ' + allVips.length + ' VIPs.', 'success');
}

function csvCell(value) {
  const s = String(value == null ? '' : value);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

async function copyVipUrl(token) {
  const baseUrl = GALLERY_URL.replace(/\/index\.html$/, '/');
  const url = baseUrl + '?token=' + encodeURIComponent(token);
  try {
    await navigator.clipboard.writeText(url);
    showVipFeedback(token, 'Copied', false);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = url; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showVipFeedback(token, 'Copied', false); }
    catch(e2) { showVipFeedback(token, 'Copy failed', true); }
    document.body.removeChild(ta);
  }
}

async function resendVipEmail(token, name) {
  if (!confirm('Resend VIP token email to ' + name + '?')) return;
  const res = await fetch(SHEET_API_URL, {
    method: 'POST', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ action: 'adminResendToken', token, pwd: ADMIN_PASSWORD }),
  });
  const data = await res.json();
  if (data.success) {
    showVipFeedback(token, 'Sent', false);
  } else {
    showVipFeedback(token, data.error || 'Failed', true);
  }
}

async function toggleVipActive(token, active) {
  const res = await fetch(SHEET_API_URL, {
    method: 'POST', headers: {'Content-Type':'text/plain'},
    body: JSON.stringify({ action: 'adminToggleTokenActive', token, active, pwd: ADMIN_PASSWORD }),
  });
  const data = await res.json();
  if (data.success) {
    const vip = allVips.find(v => v.token === token);
    if (vip) vip.active = active;
    renderVipList();
  } else {
    loadVipList();
  }
}

function showVipFeedback(token, msg, isError) {
  const el = document.getElementById('vip-feedback-' + token);
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  el.classList.toggle('error', !!isError);
  setTimeout(() => el.classList.remove('show'), 1800);
}

function setVipStatus(msg, type) {
  const el = document.getElementById('vip-list-status');
  if (!el) return;
  el.textContent = msg;
  el.className = 'vip-list-status' + (type ? ' ' + type : '');
}

// ---- HELPERS ----
function statusLabel(s) { return s==='sold'?'Sold':s==='pending'?'Pending':'Available'; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escA(s) { return String(s||'').replace(/'/g,"\\'").replace(/"/g,'\\"'); }
function fmt(ts) { try { return new Date(ts).toLocaleTimeString('en-AU',{hour:'2-digit',minute:'2-digit'}); } catch{return '';} }
