<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conners Conners — Payment</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --white: #ffffff;
    --off-white: #f8f8f8;
    --light-gray: #eeeeee;
    --mid-gray: #999999;
    --border: #e0e0e0;
    --pending: #b07d3a;
    --sold: #999999;
    --font: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { font-family: var(--font); background: var(--white); color: var(--black); min-height: 100vh; font-size: 14px; }

  header { padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 48px; position: sticky; top: 0; background: var(--white); z-index: 100; border-bottom: 1px solid var(--border); }
  .logo { font-size: 14px; font-weight: 700; color: var(--black); text-decoration: none; }
  nav { display: flex; }
  nav a { font-size: 13px; color: var(--mid-gray); text-decoration: none; padding: 0 14px; height: 48px; display: flex; align-items: center; border-left: 1px solid var(--border); transition: color 0.1s; }
  nav a:hover { color: var(--black); }
  nav a.active { color: var(--black); font-weight: 700; }

  .intro { padding: 40px 24px 28px; border-bottom: 1px solid var(--border); max-width: 600px; }
  .intro-eyebrow { font-size: 12px; color: var(--mid-gray); margin-bottom: 8px; }
  .intro h1 { font-size: clamp(34px, 7vw, 52px); font-weight: 700; line-height: 1.1; }
  .intro p { font-size: 13px; line-height: 1.6; color: #444; margin-top: 12px; }

  .pay { padding: 28px 24px 0; max-width: 600px; }
  .pay-card { border: 2px solid var(--black); padding: 4px 22px 12px; margin-bottom: 18px; }
  .pay-card-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mid-gray); padding: 14px 0 4px; }
  .pay-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .pay-row:last-child { border-bottom: none; }
  .pay-label { font-size: 13px; color: var(--mid-gray); white-space: nowrap; }
  .pay-value-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-width: 0; }
  .pay-value { font-size: 15px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; word-break: break-word; }
  .copy-btn { flex-shrink: 0; font-family: var(--font); font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 6px 11px; border: 1px solid var(--black); background: var(--white); color: var(--black); cursor: pointer; transition: all 0.1s; }
  .copy-btn:hover { background: var(--black); color: var(--white); }
  .copy-btn.copied { background: var(--black); color: var(--white); border-color: var(--black); }
  .placeholder { font-weight: 400; color: var(--mid-gray); border: 1px dashed var(--mid-gray); border-radius: 2px; padding: 1px 8px; font-size: 12px; letter-spacing: 0.02em; white-space: nowrap; }

  .pay-or { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid-gray); text-align: center; margin: 2px 0 18px; }

  .ref-card { max-width: 600px; padding: 0 24px; }
  .ref-card .pay-card { border-width: 1px; background: var(--off-white); margin-bottom: 0; }

  footer { border-top: 1px solid var(--border); padding: 24px; font-size: 12px; color: var(--mid-gray); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-top: 32px; }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo">Conners Conners</a>
  <nav>
    <a href="index.html">Works</a>
    <a href="artists.html">Artists</a>
  </nav>
</header>

<section class="intro">
  <p class="intro-eyebrow">Conners Conners Gallery — Fundraiser 2026</p>
  <h1>Payment</h1>
</section>

<section class="pay">
  <div class="pay-card" id="payid-card"></div>
</section>

<section class="ref-card">
  <div class="pay-card">
    <div class="pay-row"><span class="pay-label">Reference</span><span class="pay-value">Your name and the work number</span></div>
  </div>
</section>

<footer>
  <span>Conners Conners Gallery</span>
  <span id="footer-year"></span>
</footer>

<script>
  // ============================================================
  // PAYMENT DETAILS — PayID, PayID type and bank are pre-filled
  // from the backend. Set a value to '' to show a "To be confirmed"
  // placeholder.
  // ============================================================
  const PAYMENT = {
    payId:         '37128241411',   // PayID value
    payIdType:     'ABN',           // email / phone / ABN
    bankName:      'Westpac',
  };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
  function val(v) { return (v && String(v).trim()) ? esc(v) : '<span class="placeholder">To be confirmed</span>'; }
  function row(label, v) {
    const filled = v && String(v).trim();
    const copyBtn = filled ? `<button type="button" class="copy-btn" data-copy="${esc(v)}" aria-label="Copy ${esc(label)}">Copy</button>` : '';
    return `<div class="pay-row"><span class="pay-label">${esc(label)}</span><span class="pay-value-wrap"><span class="pay-value">${val(v)}</span>${copyBtn}</span></div>`;
  }

  document.getElementById('payid-card').innerHTML =
    '<div class="pay-card-title">Pay by PayID</div>' +
    row('PayID', PAYMENT.payId) +
    row('PayID type', PAYMENT.payIdType) +
    row('Bank', PAYMENT.bankName);

  document.getElementById('footer-year').textContent = new Date().getFullYear();

  // Copy-to-clipboard for each payment field
  document.addEventListener('click', e => {
    const btn = e.target.closest('.copy-btn');
    if (!btn) return;
    copyText(btn.dataset.copy || '').then(ok => {
      if (!ok) return;
      btn.textContent = 'Copied';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
    });
  });

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(() => true).catch(() => fallbackCopy(text));
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
</script>

</body>
</html>
